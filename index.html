
<!DOCTYPE html>
<html>
<head>
    <title>My Website</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: lightblue;
            text-align: center;
            margin: 0;
        }

        header {
            background-color: navy;
            color: white;
            padding: 20px;
        }

        .container {
            background-color: white;
            margin: 50px auto;
            padding: 30px;
            width: 60%;
            border-radius: 10px;
        }

        button {
            background-color: navy;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background-color: blue;
        }

        footer {
            background-color: navy;
            color: white;
            padding: 10px;
        }
    </style>
</head>

<body>

    <header>
        <h1>Welcome to My Website</h1>
        <p>Learning HTML and CSS</p>
    </header>

    <div class="container">
        <h2>About Us</h2>
        <p>This is a simple webpage created using HTML and CSS.</p>

        <button>Click Me</button>
    </div>

    <footer>
        <p>© 2026 My Website</p>
    </footer>

</body>
</html>
